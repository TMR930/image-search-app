[project]
name = "image-search-app"
version = "0.1.0"
description = "A Streamlit app for searching and saving images from Bing"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "icrawler>=0.6.7",
    "streamlit>=1.61.1",
]

[dependency-groups]
dev = [
    "pillow>=9.0.1",
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
